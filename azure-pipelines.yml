# =============================================================================
# azure-pipelines.yml — aes-hotsite
#
# Pipeline CI/CD para deploy no Azure App Service Linux.
# Padrao estabelecido no projeto obraxs-hotsite, adaptado para:
#   - Next.js 16 standalone + Prisma 7 (SQL Server)
#   - Deploy via Azure App Service (nao Docker)
#   - Sem testes unitarios por enquanto (apenas lint)
#
# Pre-requisitos no Azure DevOps:
#   1. Variable Group "aes-next-vars" (referenciado no job de Deploy)
#   2. Service Connection "aes-next-connection" para o App Service
# =============================================================================

trigger:
  branches:
    include:
      - main

pr: none

# =============================================================================
# Variaveis globais do pipeline
# =============================================================================
# Sintaxe de lista (nao mapa) porque `- group:` so existe nessa forma.
# O grupo precisa estar declarado aqui: em pipeline YAML nao da para vincular
# variable group pela interface. Sem esta linha, $(DATABASE_URL) e companhia
# chegavam ao stage de Build como texto literal "$(DATABASE_URL)".
variables:
- group: aes-next-vars
- name: azureSubscription
  value: 'aes-next-connection'
- name: appName
  value: 'aes-next-prod'
- name: nodeVersion
  value: '20.x'
- name: packagePath
  value: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'

# =============================================================================
# STAGE 1 — CI: Lint + Validacoes
# Roda em todo push para garantir qualidade antes do build
# =============================================================================
stages:
- stage: CI
  displayName: 'CI — Lint e Validacoes'
  pool:
    vmImage: 'ubuntu-latest'
  jobs:
  - job: LintAndValidate
    displayName: 'Lint + Type Check'
    steps:
    - task: NodeTool@0
      displayName: 'Configurar Node.js $(nodeVersion)'
      inputs:
        versionSpec: '$(nodeVersion)'

    - task: Cache@2
      displayName: 'Cache npm'
      inputs:
        key: 'npm | "$(Agent.OS)" | package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
        path: $(Pipeline.Workspace)/.npm

    - script: |
        npm ci --cache $(Pipeline.Workspace)/.npm
      displayName: 'npm ci'

    - script: npm run lint
      displayName: 'ESLint'

    - script: npm audit --audit-level=high
      displayName: 'npm audit — CVEs high/critical'

# =============================================================================
# STAGE 2 — Build: Prisma Generate + Next.js Build + Artefato
# Depende do CI para garantir que nao deployamos codigo quebrado
# =============================================================================
- stage: Build
  displayName: 'Build — Next.js'
  dependsOn: CI
  pool:
    vmImage: 'ubuntu-latest'
  jobs:
  - job: Build
    displayName: 'Prisma generate + next build'
    steps:
    - checkout: self
      clean: true

    - task: NodeTool@0
      displayName: 'Configurar Node.js $(nodeVersion)'
      inputs:
        versionSpec: '$(nodeVersion)'

    - task: Cache@2
      displayName: 'Cache npm'
      inputs:
        key: 'npm | "$(Agent.OS)" | package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
        path: $(Pipeline.Workspace)/.npm

    - script: |
        npm ci --cache $(Pipeline.Workspace)/.npm
      displayName: 'npm ci'

    - script: |
        npm run build
      displayName: 'prisma generate + next build'
      env:
        NODE_ENV: production
        DATABASE_URL: $(DATABASE_URL)
        NEXTAUTH_SECRET: $(NEXTAUTH_SECRET)
        NEXTAUTH_URL: $(NEXTAUTH_URL)
        AZURE_STORAGE_CONNECTION_STRING: $(AZURE_STORAGE_CONNECTION_STRING)

    - script: |
        set -e
        test -f .next/standalone/server.js
        mkdir -p package
        cp -R .next/standalone/* package/
        cp -R .next package/.next
        if [ -d public ]; then cp -R public package/public; fi
      displayName: 'Preparar artefato standalone'

    - task: ArchiveFiles@2
      displayName: 'Compactar artefato'
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)/package'
        includeRootFolder: false
        archiveType: zip
        archiveFile: '$(packagePath)'
        replaceExistingArchive: true

    - publish: '$(packagePath)'
      artifact: drop
      displayName: 'Publicar artefato'

# =============================================================================
# STAGE 3 — Deploy: Azure App Service Linux
# =============================================================================
- stage: Deploy
  displayName: 'Deploy — Producao'
  dependsOn: Build
  condition: succeeded()
  pool:
    vmImage: 'ubuntu-latest'
  jobs:
  - deployment: DeployToAppService
    displayName: 'Deploy para Azure App Service Linux'
    environment: '$(appName)'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop

          - task: AzureWebApp@1
            displayName: 'Deploy no App Service'
            inputs:
              azureSubscription: '$(azureSubscription)'
              appType: webAppLinux
              appName: '$(appName)'
              package: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'
              runtimeStack: 'NODE|20-lts'
              startUpCommand: 'node server.js'
              # Ambas vem do variable group aes-next-vars, como secret:
              #
              # ADMIN_PASSWORD_HASH — sem ela, /api/auth/admin/login responde
              #   500 e o painel /admin fica inacessivel.
              # AZURE_STORAGE_CONNECTION_STRING — sem ela, a gravacao no blob
              #   falha em silencio: o cache de destaques nunca e criado e os
              #   uploads de boletim, galeria e documentos nao funcionam.
              #
              # Aplicar aqui, e nao pelo portal, faz a configuracao ser reposta
              # a cada deploy em vez de existir so como estado manual.
              appSettings: >-
                -NODE_ENV production
                -ADMIN_PASSWORD_HASH $(ADMIN_PASSWORD_HASH)
                -AZURE_STORAGE_CONNECTION_STRING $(AZURE_STORAGE_CONNECTION_STRING)
